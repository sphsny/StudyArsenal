<link rel="stylesheet" href="css/styles.css">

<h1 class="pt-3 text-center">Welcome to your activities!</h1> <!-- padding top, center text on site -->
<div class="d-flex px-5" style="height: 75vh;"> <!-- align containers side by side, horizontal padding, height -->

<!-- container for subjects/activity -->
<div class="container px-0 p-3 my-3 border text-center col-3">
    <h2>Activities</h2>
    <ul class="list-group mt-3" id="activity-list">
        <li class="list-group-item fs-4">Guitar</li>
        <li class="list-group-item fs-4">COMP1004</li>
    </ul>
</div>

<!-- container for session in each subject/activity -->
<div class="container px-0 p-3 my-3 border text-center col-3">
    <h2>Sessions</h2>
    <ul class="list-group mt-3" id="session-list">
        <li class="list-group-item fs-4">Session 1</li>
    </ul>
</div>

<!-- container for notes -->
<div class="container p-3 my-3 border text-center col-6">
    <h2>Notes</h2>
    <ul class="list-group" id="notes-list">
        <div class="mt-2">
            <textarea class="form-control" id="exampleFormControlTextarea1" rows="16"></textarea>
        </div>
        <div class="d-flex">
            <button class="black-button d-flex align-self-start mt-3 px-3 mx-1" onclick="saveNote()">Save Note</button>
        </div>
    </ul>
</div>

<script>
    // button id: addActivity -> open form to type in activity name -> save as list object and display
    // button id: clickOnActivity -> open session list from that activity (nested json data?)
    // button id: addSession -> open form to type in session name -> save as list object and display
    // button id: clickOnSession -> open notes from that session in the open form field, ready to edit etc.
    // button id: saveNote -> save the current form in notes
</script>
