<link rel="stylesheet" href="css/styles.css">

<body>
    <h1 class="container-header" id="activities-header">Welcome to your activities!</h1> <!-- padding top, center text on site -->
        <!-- container for subjects/activity -->
    <div class="container">

        <div class="text-center subject-container">
            <h1 class="overview-header">Subjects</h1>
            <ul class="list" id="subject-list">
                <li class="list-item">Subject</li>
            </ul>
        </div>

        <!-- container for session in each subject/activity -->
        <div class="text-center session-container">
            <h1 class="overview-header">Sessions</h1>
            <ul class="list" id="session-list">
                <li class="list-item">Session</li>
            </ul>
        </div>

        <!-- container for notes -->
        <div class="text-center note-container">
            <h1 class="overview-header">Notes</h1>
            <textarea id="note"></textarea>
        </div>
    </div>
</body>
