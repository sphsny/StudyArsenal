<!-- link css styles -->
<link rel="stylesheet" href="./css/styles.css">

<body>

    <h1 class="container-header">Welcome to your calendar!</h1>

    <div class="event-form">
        <input type="text" id="event-name" placeholder="Event Name">
        <input type="date" id="event-date">
        <button id="add-event">Add Event</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Event Name</th>
                <th>Days Until</th>
                <th></th> <!-- place to expand each event with delete button -->
            </tr>
        </thead>
        <tbody id="event-list">
        </tbody>
    </table>

</body>
