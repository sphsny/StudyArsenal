<link rel="stylesheet" href="css/styles.css">

<body>
    <h1 class="container-header">Track your time here!</h1>

    <div class="timer-container">
        <!-- choose subject -->
        <h4>Choose your subject</h4>
        <select class="selectSubject" id="inlineFormCustomSelect">
            <option value="">Select a subject</option>
            <input type="text" id="customSessionName" placeholder="Enter session name">
        </select>
        
        <!-- timer from easytimer.js -->
        <div id="chronoExample">
            <div class="values">00:00:00</div>
                <button class="btn startButton">Start</button>
                <button class="btn pauseButton">Pause</button>
                <button class="btn stopButton">Stop</button>
                <button class="btn resetButton">Reset</button>
        </div>

        <!-- add manual time -->
        <div id="manualTimeForm">
            <h4>or manually add time</h4>
            <input type="date" id="manualDate"> <!-- automatically takes the date format from users' local system -->
            <input type="text" id="manualTime" placeholder="hours:minutes">
            <button id="submitManualTime" class="btn">Submit</button>
        </div>
    </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/easytimer.js/dist/easytimer.min.js"></script>
