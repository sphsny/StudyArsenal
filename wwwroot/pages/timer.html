<script>

    // select subject by reading from json file
$(document).ready(function () {
    $.getJSON("../data/user.json", function (data) {
        let $select = $("#inlineFormCustomSelect");

        $.each(data.subjects, function (index, subject) {
            $select.append($("<option>", {
                value: subject.id,
                text: subject.name
            }));
        });
    });
});


    // timer script from https://albert-gonzalez.github.io/easytimer.js/

    $(document).ready(function () {

        var timer = new easytimer.Timer();

        $('#chronoExample .startButton').click(function () {
            console.log("Start button clicked");
            timer.start();
        });

        $('#chronoExample .pauseButton').click(function () {
            console.log("Pause button clicked");
            timer.pause();
        });

        $('#chronoExample .stopButton').click(function () {
            console.log("Stop button clicked");
            timer.stop();
        });

        $('#chronoExample .resetButton').click(function () {
            console.log("Reset button clicked");
            timer.reset();
        });

        timer.addEventListener('secondsUpdated', function () {
            console.log("Timer updated: " + timer.getTimeValues().toString());
            $('#chronoExample .values').html(timer.getTimeValues().toString());
        });

        timer.addEventListener('started', function () {
            console.log("Timer started");
            $('#chronoExample .values').html(timer.getTimeValues().toString());
        });

        timer.addEventListener('reset', function () {
            console.log("Timer reset");
            $('#chronoExample .values').html(timer.getTimeValues().toString());
        });

        timer.addEventListener('stopped', function () {
            console.log("Timer stopped");
        });
    });

</script>
