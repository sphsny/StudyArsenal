<!-- OVERVIEW/HOME PAGE -->

    <!-- PROFILE (left-hand side)-->

        <h1>Profile</h1>
            <!-- profile picture place holder -->
            <image src="./images/profilePicturePlaceHolder.png" class="rounded-circle img-thumbnail img-fluid" style="width: 300px; height: 300px; object-fit: cover;"></image> <!-- image from https://commons.wikimedia.org/wiki/File:Profile_avatar_placeholder_large.png -->
            <!-- java script to change profile picture -->
            <input type="file" id="profile-picture-input" style="display: none;" accept="image/*" onchange="updateProfilePicture(this)">

    <!-- TASKS (right-hand side) done with the help of a youtube tutorial: https://youtu.be/3OqWCGVaOkA -->
    <div class="container p-3 my-3 border text-center col-7">
        <h1>Tasks</h1>
        <!-- input form to add tasks, id for javascript: todoInput -->
        <input
            type="text text-purple"
            id="todoInput"
            placeholder="Enter your task..."
        />
        <button id="addButton" class="btn">Add</button>
        <hr>
        <ul class="d-flex flex-column align-items-start"> <!-- padding, align on top of each other, align at start -->
            <!-- list for tasks with id todoList -->
             <li id="todoList"></li>
        </ul>
        <!-- buttons to save and delete selected task ?? maybe idk -->
        <div>
        </div>
    </div>
</div>

<script>
// done with the help of a youtube tutorial: https://youtu.be/3OqWCGVaOkA

// retrieve todo tasks from local storage
let todo = JSON.parse(localStorage.getItem("todo")) || [];

// constants
const todoInput = document.getElementById("todoInput");
const todoList = document.getElementById("todoList");
const addButton = document.getElementById("addButton");
const deleteButton = document.getElementById("deleteButton");

// initialisation
document.addEventListener("DOMContentLoaded", function () {
    addButton.addEventListener("click", addTask); // run addTask function on click
});

// functions
function addTask() {
    const newTask = todoInput.value();
    if (newTask !== "") { // prevent empty input to be added as task
        todo.push({
            text: newTask, // push new task onto the array of todoList as text
            disabled: false, // disable checkbox by default
        });
        saveToLocalStorage();
        todoInput.value = "";
        displayTasks();
    }
}

function saveToLocalStorage() {
    localStorage.setItem("todo", JSON.stringify(todo));
}

function displayTasks() {
    todoList.innerHTML = ""; // start todo list with empty string
    todo.forEach((item, index) => {
        const p = document.createElement("p");
        // write HTML inside JavaScript with ``
    })
}
</script>
