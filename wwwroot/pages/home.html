<!-- link css styles -->
<link rel="stylesheet" href="./css/styles.css">
<!-- link jquery -->

<!-- OVERVIEW/HOME PAGE -->
<h1 class="pt-3 text-center">Welcome to your home page!</h1> <!-- padding top, center text on site -->
<div class="d-flex px-5" style="height: 75vh;"> <!-- align two containers side by side, horizontal padding, height -->

    <!-- PROFILE (left-hand side)-->
    <div class="container p-3 my-3 border text-center col-5"> <!-- create container, inside padding, vertical margin, center text, take space of 5 columns -->
        <h1>Profile</h1>
            <!-- profile picture place holder -->
            <image src="./images/profilePicturePlaceHolder.png" class="rounded-circle img-thumbnail img-fluid" style="width: 300px; height: 300px; object-fit: cover;"></image> <!-- image from https://commons.wikimedia.org/wiki/File:Profile_avatar_placeholder_large.png -->
            <!-- java script to change profile picture -->
            <input type="file" id="profile-picture-input" style="display: none;" accept="image/*" onchange="updateProfilePicture(this)">
            <!-- user NAME -->
            <p class="pt-3 fs-2 font-monospace text-purple align-items-center">
                <span id="username">Username</span>
                <span class="btn btn-editName" id="editName">✏️</span>
            </p>

            <!-- user attributes -->
             <p class="fs-5">Time tracked: 0h</p> <!-- needs javascript to keep track -->
    </div>

    <!-- TASKS (right-hand side) done with the help of a youtube tutorial: https://youtu.be/3OqWCGVaOkA -->
    <div class="container p-3 my-3 border text-center col-7">
        <h1>Tasks</h1>
        <!-- input form to add tasks, id for javascript: todoInput -->
        <input
            type="text text-purple"
            id="todoInput"
            placeholder="Enter your task..."
        />
        <button id="addButton" class="btn">Add</button>
        <hr>
        <ul class="pt-3"> <!-- padding, align on top of each other, align at start -->
            <!-- list for tasks with id todoList -->
             <li id="todoList"></li>
        </ul>
        <!-- buttons to save and delete selected task ?? maybe idk -->
        <div>
        </div>
    </div>
</div>

<button id="myButton">Click Me!</button>

<script>
        // done with the help of a youtube tutorial: https://youtu.be/3OqWCGVaOkA!!!!!!!
    
    // retrieve todo tasks from local storage
    let todo = JSON.parse(localStorage.getItem("todo")) || [];
    
    // constants
    const todoInput = document.getElementById("todoInput");
    const todoList = document.getElementById("todoList");
    const addButton = document.getElementById("addButton");
    const deleteButton = document.getElementById("deleteButton");
    
    // initialisation
    document.addEventListener("DOMContentLoaded", function () {
        addButton.addEventListener("click", addTask); // run addTask function on click
        displayTasks();
    });
    
    // functions
    function addTask() {
        const newTask = todoInput.value;
        if (newTask !== "") { // prevent empty input to be added as task
            todo.push({
                text: newTask, // push new task onto the array of todoList as text
                disabled: false, // disable checkbox by default
            });
            saveToLocalStorage();
            todoInput.value = "";
            displayTasks();
        }
    }
    
    function saveToLocalStorage() {
        localStorage.setItem("todo", JSON.stringify(todo));
    }
    
    function displayTasks() {
    todoList.innerHTML = "";
    todo.forEach((item, index) => {
        const p = document.createElement("p");
        p.innerHTML = `
            <div class="todo-container">
                <input type="checkbox" class="todo-checkbox" id="input-${index}" ${
            item.disabled ? "checked" : ""
            }>
                <p id="todo-${index}" class="${
            item.disabled ? "disabled" : ""
            }" onclick="editTask(${index})">${item.text}</p>
            </div>
        `;
        p.querySelector(".todo-checkbox").addEventListener("change", () =>
            toggleTask(index)
        );
            todoList.appendChild(p);
        });
        todoCount.textContent = todo.length;
    }

    function toggleTask(index) {
        todo[index].disabled = !todo[index].disabled;
        saveToLocalStorage();
        displayTasks();
    }
</script>
