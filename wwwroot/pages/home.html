<!-- link css styles -->
<link rel="stylesheet" href="./css/styles.css">

<body>
    <!-- MAIN CONTENT -->
    <h1 class="container-header text-center">Welcome to your home page!</h1> <!-- padding top, center text on site -->
        <!-- PROFILE (left-hand side)-->
        <div class="container"> <!-- create container, inside padding, vertical margin, center text, take space of 5 columns -->
            <div class="profile-container container-fluid">
            <h1>Profile</h1>
                <!-- profile picture place holder -->
                <image src="./images/profilePicturePlaceHolder.png" id="profile-img"></image> <!-- image from https://commons.wikimedia.org/wikiFile:Profile_avatar_placeholder_large.png -->
                <!-- java script to change profile picture -->
                <input type="file" id="profile-picture-input" style="display: none;" accept="image/*">
                <!-- username -->
                <p>
                    <input type="text" id="username" placeholder="Your username">
                </p>
                <!-- user attributes -->
                <p id="timeTracked"></p>
            </div>

        <!-- TASKS (right-hand side) done with the help of a youtube tutorial: https://youtu.be/3OqWCGVaOkA -->
        <div class="tasks-container container-fluid">
            <h1 class="centered">Tasks</h1>
            <div class="centered">
                <input
                    type="text"
                    id="todoInput"
                    placeholder="Enter your task"
                />
                <button id="addButton" class="btn btn-addTask">Add</button>
            </div>
            <ul class="pt-3"> <!-- padding, align on top of each other, align at start -->
                <li class="" id="todoList"></li>
            </ul>
        </div>
    </div>
    <div class="container centered" id="JSONfunctions">
        <button id="deleteData" class="btn">Delete all data</button>
    </div>
    <br>
</body>
